version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        # Nothing useful to do if writing to stdout/stderr fails.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Test HTTP handlers can't meaningfully handle encode errors.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
